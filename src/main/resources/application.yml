spring:
  application:
    name: rate-my-pc-bro
  
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: llama3.2
          num-predict: 2048
    openai:
      base-url: https://openrouter.ai/api
      api-key: ${OPENROUTER_API_KEY}
      chat:
        options:
          model: openai/gpt-4o-mini

brave:
  search:
    api-key: ${BRAVE_SEARCH_API_KEY:}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: alpha
    tagsSorter: alpha
  show-actuator: true

server:
  port: 8081
  servlet:
    context-path: /api

logging:
  level:
    com.ratemypcbro: DEBUG
    org.springframework.ai.chat.client.advisor: DEBUG
